{% extends 'base.html' %}

{% block title %}
Главная страница
{% endblock %} 

{% block content %}
<h1>Главная страница</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

{% endblock  %}
